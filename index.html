<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursor spend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .drift-caret {
      display: inline-block;
      width: 0;
      height: 0;
      border-top: 0.35em solid transparent;
      border-bottom: 0.35em solid transparent;
      border-left: 0.55em solid currentColor;
      transition: transform 0.15s;
      vertical-align: -0.05em;
    }
    details[open] .drift-caret {
      transform: rotate(90deg);
    }
  </style>
</head>
<body class="min-h-screen bg-stone-100 text-stone-900 antialiased">
  <div class="mx-auto max-w-5xl px-4 py-5 pb-12">
    <header class="mb-6 flex items-baseline justify-between gap-4 border-b border-stone-300 pb-3">
      <h1 class="text-xl font-semibold uppercase tracking-wide">Cursor spend</h1>
      <button
        type="button"
        id="refresh-btn"
        class="border border-stone-300 px-3 py-1.5 text-sm hover:bg-stone-200 disabled:cursor-wait disabled:opacity-50"
      >更新</button>
    </header>
    <main id="root" class="flex flex-col gap-8"></main>
  </div>
  <script src="snapshot.js"></script>
  <script>
    const $ = (sel, el = document) => el.querySelector(sel);
    const HISTORY_LIMIT = 4;
    const POOL = {
      cursor: { text: "text-green-700", bg: "bg-green-700", border: "border-green-700" },
      other: { text: "text-blue-800", bg: "bg-blue-800", border: "border-blue-800" },
    };
    const ROW =
      "grid grid-cols-[6.5rem_1fr_auto] gap-2 items-baseline border-b border-stone-300 py-1 text-sm tabular-nums";
    const SLOT = ROW + " invisible max-md:hidden";

    function h(tag, props, kids) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props || {})) {
        if (value == null || value === false) continue;
        if (key === "class") node.className = value;
        else node.setAttribute(key, value);
      }
      for (const kid of kids || []) {
        if (kid == null || kid === false || kid === "") continue;
        node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
      }
      return node;
    }

    function money(n) {
      return "$" + (Number(n) || 0).toFixed(2);
    }

    function cycleLabel(cycle) {
      if (!cycle?.start || !cycle?.end) return "";
      const fmt = (iso) => {
        const d = new Date(iso);
        return d.getMonth() + 1 + "/" + d.getDate();
      };
      return fmt(cycle.start) + " – " + fmt(cycle.end);
    }

    function tokyoParts(iso, extra) {
      const parts = new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        hourCycle: "h23",
        ...extra,
      }).formatToParts(new Date(iso));
      return (t) => parts.find((p) => p.type === t)?.value || "";
    }

    function tokyoTime(iso) {
      if (!iso) return "";
      const get = tokyoParts(iso, { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      return get("month") + "/" + get("day") + " " + get("hour") + ":" + get("minute");
    }

    function tokyoBudgetReset(iso) {
      if (!iso) return "";
      const get = tokyoParts(iso, {
        month: "numeric",
        day: "numeric",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
      });
      return get("month") + "月" + get("day") + "日（" + get("weekday") + "）" + get("hour") + ":" + get("minute");
    }

    function heroTone(s) {
      const other = s.pools?.other?.percentUsed ?? 0;
      const od = s.spend?.onDemandUsd ?? 0;
      return other >= 100 || od > 0 ? "text-red-600" : "text-green-700";
    }

    function fact(title, value) {
      if (!value) return null;
      return h("div", {}, [
        h("h3", { class: "mb-1 font-semibold" }, [title]),
        h("p", { class: "text-base" }, [value]),
      ]);
    }

    function driftNote(s) {
      if (!s.drift) return null;
      return h("div", { class: "min-w-0" }, [
        h("div", { class: "flex flex-col gap-2 items-start" }, [
          h("p", { class: "text-sm text-stone-600" }, [
            "Cursor 請求画面: " + money(s.drift.meterUsd),
          ]),
          h("details", { class: "min-w-0" }, [
            h("summary", {
              class: "cursor-pointer list-none text-xs leading-relaxed text-stone-500 hover:text-stone-700 [&::-webkit-details-marker]:hidden",
            }, [
              "※Cursor が請求画面に出している数字です。",
              h("br"),
              h("span", { class: "inline-flex items-center gap-1.5 text-stone-400" }, [
                h("span", { class: "drift-caret" }),
                h("span", { class: "text-stone-500" }, ["赤い数字と値が違う理由"]),
              ]),
            ]),
            h("p", { class: "mt-2 text-xs leading-normal text-stone-500" }, [
              "赤い数字は、追加課金が付いた利用を1回ずつ足した合計です。",
              h("br"),
              "Cursor 請求画面の数字は、別の API フィールドから来ています。同じ追加課金でも、集計方法が違います。",
              h("br"),
              "Team プランでは、1回の利用コストがそのまま請求画面に載るとは限りません。計算式は Cursor が公開していません。",
            ]),
          ]),
        ]),
      ]);
    }

    function sideNotes(s) {
      const nodes = [];
      const drift = driftNote(s);
      if (drift) nodes.push(drift);
      const unknown = s.unknownKinds || [];
      if (unknown.length) {
        const text = unknown.map((u) => u.kind + " × " + u.count).join("、");
        nodes.push(h("p", { class: "text-sm text-amber-800" }, ["未分類: " + text]));
      }
      if (!nodes.length) return null;
      if (nodes.length === 1) return nodes[0];
      return h("div", { class: "flex min-w-0 flex-col gap-2" }, nodes);
    }

    function amountRow(s) {
      const hero = h("p", { class: "shrink-0 text-5xl font-bold tabular-nums leading-none " + heroTone(s) }, [
        money(s.spend?.onDemandUsd),
      ]);
      const side = sideNotes(s);
      if (!side) return hero;
      return h("div", { class: "flex items-start gap-4 max-md:flex-col" }, [hero, side]);
    }

    function poolBar(label, kind, pct) {
      const st = POOL[kind];
      const w = Math.min(100, Math.max(0, Number(pct) || 0));
      return h("div", {}, [
        h("div", { class: "mb-1 flex justify-between text-sm font-medium" }, [
          h("span", { class: st.text }, [label]),
          h("span", {}, [(Number(pct) || 0).toFixed(1) + "%"]),
        ]),
        h("div", { class: "h-2 overflow-hidden bg-stone-300" }, [
          h("i", { class: "block h-full " + st.bg, style: "width:" + w + "%" }),
        ]),
      ]);
    }

    function sectionMeter(s) {
      const plan = s.plan ? s.plan.name + " · $" + Number(s.plan.seatUsd || 0).toFixed(0) + "/mo" : "";
      const reset = s.cycle?.end ? tokyoBudgetReset(s.cycle.end) + "（日本時間）" : "";
      const team = s.team ? money(s.team.onDemandUsd) + " / " + money(s.team.limitUsd) : "";
      return h("section", { class: "flex flex-col gap-5" }, [
        h("p", { class: "font-semibold" }, ["今サイクルの追加課金"]),
        amountRow(s),
        h("div", { class: "flex flex-col gap-4" }, [
          poolBar("Cursor Models", "cursor", s.pools?.cursor?.percentUsed ?? 0),
          poolBar("Other Models", "other", s.pools?.other?.percentUsed ?? 0),
        ]),
        h("div", { class: "grid grid-cols-1 gap-8 md:grid-cols-2" }, [
          h("div", { class: "space-y-5" }, [fact("プラン", plan), fact("チーム", team)]),
          h("div", { class: "space-y-5 max-md:border-t max-md:border-stone-300 max-md:pt-5" }, [
            fact("サイクル", cycleLabel(s.cycle)),
            fact("バジェット更新", reset),
          ]),
        ]),
      ]);
    }

    function spendBits(m) {
      const bits = [];
      if (m.includedUsd) bits.push("Included " + money(m.includedUsd));
      if (m.onDemandUsd) bits.push("On-demand " + money(m.onDemandUsd));
      if (m.calls) bits.push(m.calls + "回");
      return bits.join(" · ");
    }

    function groupsFor(s, pool) {
      const byModel = new Map();
      const ensure = (name, model) => {
        if (!byModel.has(name)) byModel.set(name, { model, times: [] });
        return byModel.get(name);
      };
      for (const m of s.models || []) {
        if ((m.pool || "other") === pool) ensure(m.model, m);
      }
      for (const u of s.uses || []) {
        if ((u.pool || "other") !== pool) continue;
        ensure(u.model, { model: u.model, includedUsd: 0, onDemandUsd: 0, calls: 0 }).times.push(u);
      }
      const total = (m) => (m.includedUsd || 0) + (m.onDemandUsd || 0);
      return [...byModel.values()].sort((a, b) => total(b.model) - total(a.model));
    }

    function historyRow(u) {
      if (!u) {
        return h("li", { class: SLOT, "aria-hidden": "true" }, [
          h("span", { class: "text-stone-500" }, ["\u00a0"]),
          h("span"),
          h("span"),
        ]);
      }
      return h("li", { class: ROW }, [
        h("span", { class: "text-stone-500" }, [tokyoTime(u.at)]),
        h("span", { class: "text-stone-500" }, [u.onDemand ? "On-demand" : "Included"]),
        h("span", {}, [money(u.usd)]),
      ]);
    }

    function poolHeading(pool, title) {
      const st = POOL[pool];
      return h("h2", { class: "mb-4 flex items-center gap-2 border-b-2 pb-2 text-lg font-semibold uppercase tracking-wide " + st.border }, [
        h("span", { class: "size-3 shrink-0 " + st.bg }),
        title,
      ]);
    }

    function poolColumn(s, pool, title) {
      const groups = groupsFor(s, pool);
      const heading = poolHeading(pool, title);
      if (!groups.length) {
        return [heading, h("p", { class: "text-sm text-stone-500" }, ["このサイクルの利用はありません"])];
      }
      return [
        heading,
        ...groups.map((g) => {
          const shown = g.times.slice(0, HISTORY_LIMIT);
          const hidden = g.times.length - shown.length;
          return h("div", { class: "mb-6 last:mb-0" }, [
            h("div", { class: "font-semibold" }, [g.model.model || ""]),
            h("div", { class: "mt-0.5 text-xs text-stone-500" }, [spendBits(g.model)]),
            h("ul", { class: "mt-5 list-none p-0" }, [
              ...Array.from({ length: HISTORY_LIMIT }, (_, i) => historyRow(shown[i])),
            ]),
            h("p", {
              class: (hidden > 0 ? "" : "invisible max-md:hidden ") + "mt-1 text-xs text-stone-500",
              "aria-hidden": hidden > 0 ? null : "true",
            }, [hidden > 0 ? "他 " + hidden + " 件" : "他 0 件"]),
          ]);
        }),
      ];
    }

    function sectionUses(s) {
      return h("section", { class: "grid grid-cols-1 gap-8 md:grid-cols-2" }, [
        h("div", { class: "flex flex-col gap-6" }, poolColumn(s, "cursor", "Cursor Models")),
        h("div", { class: "flex flex-col gap-6" }, poolColumn(s, "other", "Other Models")),
      ]);
    }

    function render(s) {
      const root = $("#root");
      root.replaceChildren();
      if (s.error) {
        root.append(h("p", { class: "text-xl text-red-600" }, [s.error]));
        return;
      }
      for (const fn of [sectionMeter, sectionUses]) root.append(fn(s));
    }

    const AUTO_REFRESH_MS = 5 * 60 * 1000;

    function setupRefresh() {
      const btn = $("#refresh-btn");
      if (location.protocol !== "http:" && location.protocol !== "https:") {
        btn.textContent = "python3 refresh.py を実行";
        return;
      }
      let inflight = false;
      async function pull() {
        if (inflight) return;
        inflight = true;
        btn.disabled = true;
        try {
          const data = await (await fetch("/refresh")).json();
          window.SNAPSHOT = data;
          render(data);
        } catch (e) {
          render({ error: String(e) });
        } finally {
          inflight = false;
          btn.disabled = false;
        }
      }
      btn.addEventListener("click", pull);
      setInterval(() => {
        if (document.visibilityState === "visible") pull();
      }, AUTO_REFRESH_MS);
    }

    setupRefresh();
    render(window.SNAPSHOT || { error: "snapshot.js がありません" });
  </script>
</body>
</html>
